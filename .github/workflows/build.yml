# The notebook's build path. The desktop builds locally with
# tools\Deploy-TerminalSlots.ps1, which is incremental and therefore always
# faster; this exists so a machine that should not be compiling Terminal does not
# have to.
#
# It produces exactly what a local deploy stages -- the unpacked Dev payload and
# its marker -- so tools\Fetch-CIBuild.ps1 can drop the result into a slot and the
# UPDATE button in muld treats it like any other staged build.
name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'doc/**'
      - 'docs/**'
      - 'samples/**'
      - '**/*.md'
  workflow_dispatch:

# Successive pushes make the earlier runs pointless: they are building a commit
# nobody is going to install. Cancel them rather than paying for both and waiting
# behind the one that is already stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Windows Server 2025, which carries Visual Studio Enterprise 2026 18.9,
    # MSVC 14.51 and Windows SDK 10.0.26100. This repo requires VS >= 18.6 and
    # that SDK; VS 2022 cannot build it at all, so the older images are no use.
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      # A second's worth of textual checks, so they run before the forty-minute
      # build rather than after it. This is the only gate that catches a missing
      # resource string: that compiles clean, packages clean, passes both test
      # suites, and then takes an access violation in the field the first time
      # the Settings UI asks an action for its name.
      - name: Promotion helper regression tests
        shell: powershell
        run: .\tools\Test-SlotPromotion.ps1

      - name: Settings model consistency
        shell: pwsh
        run: .\tools\Check-SettingsModelConsistency.ps1

      # Seconds here against fifteen minutes into "Restore and build", which is
      # where the XAML compiler rejects a comment containing "--". Worth its own
      # step because [xml] in PowerShell parses such a file happily, so the
      # obvious local check reports success on markup that cannot compile.
      - name: XAML comments
        shell: pwsh
        run: .\tools\Check-XamlComments.ps1

      # A resource key nothing defines compiles, packages and passes the tests,
      # then fail-fasts the page that uses it (upstream #20336 removed one the
      # Personalization page still used).
      - name: XAML resource keys
        shell: pwsh
        run: .\tools\Check-XamlResourceKeys.ps1

      # The checked-in dep\nuget\nuget.exe is 4.1.0 (2017) and predates .slnx:
      # restoring with it fails with "Invalid input 'OpenConsole.slnx'. The file
      # type was not recognized." Upstream installs a current nuget for the same
      # reason rather than bumping the bundled copy.
      #
      # No `nuget-version` input: it already defaults to `latest`.
      - uses: NuGet/setup-nuget@v4

      # NuGet.Config pins both globalPackagesFolder and repositorypath to
      # .\packages, so the whole restore lands in one self-contained folder.
      # This is the only part of the build worth caching: obj\ is far past the
      # 10 GB per-repository cache limit, and a fresh checkout's timestamps make
      # MSBuild rebuild everything regardless of what was restored.
      - uses: actions/cache@v6
        with:
          path: packages
          key: nuget-${{ runner.os }}-${{ hashFiles('NuGet.Config', 'dep/nuget/packages.config', 'build/packages.config') }}
          restore-keys: nuget-${{ runner.os }}-

      # One step, because Set-MsbuildDevEnvironment edits PATH for the process it
      # runs in and GitHub gives each step its own.
      #
      # The build itself is the same script the desktop runs, so the two paths
      # cannot drift: whatever is verified locally is what CI produces. -StageOnly
      # skips registering the Test slot, which a runner could not do anyway
      # without Developer Mode, and stops before touching anything but disk.
      - name: Native file preview preflight
        shell: pwsh
        run: |
          Import-Module .\tools\OpenConsole.psm1 -Force
          Set-MsbuildDevEnvironment
          nuget restore .\dep\nuget\packages.config -SolutionDirectory .
          nuget restore .\build\packages.config -SolutionDirectory .
          # The same reader tests as Control.Unit.Tests, before the two full builds.
          $wilPackage = Get-ChildItem .\packages -Directory -Filter 'Microsoft.Windows.ImplementationLibrary.*' | Select-Object -First 1
          if (-not $wilPackage) { throw 'WIL package was not restored' }
          $wilHeader = Get-ChildItem $wilPackage.FullName -Recurse -File -Filter resource.h | Where-Object { $_.Directory.Name -eq 'wil' } | Select-Object -First 1
          if (-not $wilHeader) { throw 'WIL headers were not found in the package' }
          $wilInclude = $wilHeader.Directory.Parent.FullName
          $previewTestExe = Join-Path $env:RUNNER_TEMP 'FilePreviewTests.exe'
          $previewTestObj = Join-Path $env:RUNNER_TEMP 'FilePreviewTests.obj'
          & cl /nologo /EHsc /std:c++20 /DFILE_PREVIEW_STANDALONE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /DUNICODE /D_UNICODE "/I$wilInclude" .\src\cascadia\UnitTests_Control\FilePreviewTests.cpp "/Fe:$previewTestExe" "/Fo:$previewTestObj" /link WindowsApp.lib ole32.lib oleaut32.lib
          if ($LASTEXITCODE -ne 0) { throw 'File preview preflight did not compile' }
          & $previewTestExe
          if ($LASTEXITCODE -ne 0) { throw 'File preview preflight failed' }
          # Hidden-child capture: job-object tree kill (conhost included) and the
          # single-flight/backoff gate the session-resume WSL probe runs behind.
          $captureTestExe = Join-Path $env:RUNNER_TEMP 'ProcessCaptureTests.exe'
          $captureTestObj = Join-Path $env:RUNNER_TEMP 'ProcessCaptureTests.obj'
          & cl /nologo /EHsc /std:c++20 /DPROCESS_CAPTURE_STANDALONE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /DUNICODE /D_UNICODE "/I$wilInclude" .\src\cascadia\UnitTests_Control\ProcessCaptureTests.cpp "/Fe:$captureTestExe" "/Fo:$captureTestObj"
          if ($LASTEXITCODE -ne 0) { throw 'Process capture preflight did not compile' }
          & $captureTestExe
          if ($LASTEXITCODE -ne 0) { throw 'Process capture preflight failed' }
      - name: Restore and build
        shell: pwsh
        run: |
          Import-Module .\tools\OpenConsole.psm1 -Force
          Set-MsbuildDevEnvironment
          msbuild .\OpenConsole.slnx /t:Restore /p:Configuration=Release /p:Platform=x64 /v:m /nologo
          .\tools\Deploy-TerminalSlots.ps1 -StageOnly

      # Builds happen here now, so this is the only thing that runs the tests at
      # all -- without it "CI green" means nothing more than "it compiled".
      #
      # Two suites, deliberately. SettingsModel.Unit.Tests is left out because it
      # fails 66 of its 161 cases on main today, the test host dying at
      # 0xC0000409, and that predates this step: it reproduces with every local
      # change stashed and the binaries rebuilt from clean sources. Gating on it
      # would paint every run red and teach everyone to ignore the colour. Put it
      # back the moment that crash is understood.
      - name: Unit tests
        shell: pwsh
        run: |
          $te = Get-ChildItem .\packages\Microsoft.Taef.*\build\Binaries\x64\te.exe -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $te) { throw 'te.exe not found under .\packages; did the restore run?' }
          $suites = @(
            '.\bin\x64\Release\Types.Unit.Tests.dll',
            '.\bin\x64\Release\UnitTests_Control\Control.Unit.Tests.dll'
          )
          $failed = @()
          foreach ($suite in $suites) {
            if (-not (Test-Path $suite)) { throw "missing test binary: $suite" }
            Write-Host "== $suite ==" -ForegroundColor Cyan
            & $te.FullName $suite
            # te.exe reports failures through its exit code; check it per suite so
            # the log names the one that broke rather than just the last to run.
            if ($LASTEXITCODE -ne 0) { $failed += $suite }
          }
          if ($failed) { throw "failing suites: $($failed -join ', ')" }

      # Diagnostic, not a gate: continue-on-error means this can never turn a run
      # red. It exists because the Settings Model is dying in the field -- opening
      # the Settings UI faults at 0xC0000005 inside
      # Microsoft.Terminal.Settings.Model.dll -- and the suite that covers that DLL
      # is the one quarantined above for a hard host crash of its own. Two hard
      # failures in the same binary are worth reading together, and this is the
      # only way to get the case names without a debugger on the dev machine.
      #
      # Remove this step and re-arm the suite in the gating list the moment the
      # crash is understood.
      - name: Unit tests (SettingsModel, diagnostic only)
        continue-on-error: true
        shell: pwsh
        run: |
          $te = Get-ChildItem .\packages\Microsoft.Taef.*\build\Binaries\x64\te.exe -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending | Select-Object -First 1
          # Note the project subdirectory. TargetName is SettingsModel.Unit.Tests
          # but ProjectName is UnitTests_SettingsModel, and the output lands under
          # the latter -- exactly as Control.Unit.Tests does above. Naming the file
          # without it silently found nothing and exited 0, so run 34049885670
          # reported this suite as fine while never loading it.
          $suite = '.\bin\x64\Release\UnitTests_SettingsModel\SettingsModel.Unit.Tests.dll'
          if (-not (Test-Path $suite)) { throw "not built: $suite" }
          # /rebootStateFile keeps te.exe from stopping at the first host death, so
          # one run reports every case rather than only the cases before the crash.
          & $te.FullName $suite /consoleLevel:0x02 2>&1 | Tee-Object -Variable output | Out-Host
          Write-Host ''
          Write-Host '===== failing cases ====='
          $output | Select-String -Pattern 'Error|Failed|Exception|0xC0000' | Select-Object -First 80

      # Unpacked rather than the .msix: it is 17 MB either way, and shipping the
      # layout means the machine that installs it needs no Windows SDK to unpack
      # one. The marker rides along so the fetcher does not have to reconstruct
      # the commit, branch and timestamp from anywhere else.
      #
      # The Test payload ships too. -StageOnly unpacks it either way (it lands in
      # test-staged before the registration branch it skips), and without it in
      # the artifact there is no way to refresh mult on a machine that does not
      # compile -- which means no way to verify UI behaviour at all.
      - uses: actions/upload-artifact@v7
        with:
          name: dev-payload
          path: |
            C:\TerminalSlots\dev-staged
            C:\TerminalSlots\test-staged
            C:\TerminalSlots\dev-pending.json
            C:\TerminalSlots\Promote-DevSlot.ps1
            C:\TerminalSlots\Refresh-TestSlot.ps1
            C:\TerminalSlots\Invoke-Hidden.vbs
            C:\TerminalSlots\Install-CIBuildPoller.ps1
            C:\TerminalSlots\Fetch-CIBuild.ps1
          if-no-files-found: error
          retention-days: 14

      # An .msix layout carries no PDBs, so a crash in mult decodes to
      # "TerminalApp!DllGetActivationFactory+0x4c9a4" and names nothing of ours.
      # That is not a theoretical loss: on 2026-09-08 a live cdb capture of the
      # tabPosition "left" fail-fast produced a complete XAML stack -- NWDrawTree,
      # UpdateLayout, CGrid::MeasureCell, FrameworkElement_MeasureOverride -- and
      # then four unnamed TerminalApp frames where the actual throw was, which is
      # exactly the part that needed reading.
      #
      # Only the modules whose code we write. bin\ holds PDBs for every
      # dependency too and none of those are worth the upload.
      - name: Collect symbols
        shell: pwsh
        run: |
          $out = 'C:\TerminalSlots\symbols'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $want = @(
            'TerminalApp.pdb'
            'mullion.pdb'
            'Microsoft.Terminal.Control.pdb'
            'Microsoft.Terminal.Settings.Model.pdb'
            'Microsoft.Terminal.Settings.Editor.pdb'
            'Microsoft.Terminal.UI.Markdown.pdb'
            'Microsoft.Terminal.UI.pdb'
          )
          foreach ($name in $want) {
            $pdb = Get-ChildItem .\bin\x64\Release -Recurse -Filter $name -ErrorAction SilentlyContinue |
                     Sort-Object Length -Descending | Select-Object -First 1
            if ($pdb) {
              Copy-Item $pdb.FullName (Join-Path $out $name) -Force
              Write-Host ("  {0,-44} {1,6:N1} MB" -f $name, ($pdb.Length / 1MB))
            }
            else {
              Write-Host "  $name -- not found"
            }
          }

      # A separate artifact so staging a build stays a small download: symbols are
      # an order of magnitude larger than the payload and are only wanted when
      # something is actually being debugged. Shorter retention for the same
      # reason -- a stack older than a few days is being read against the wrong
      # commit anyway.
      - uses: actions/upload-artifact@v7
        with:
          name: dev-symbols
          path: C:\TerminalSlots\symbols
          if-no-files-found: warn
          retention-days: 5
