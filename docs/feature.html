<script src="features.js"></script>
<script src="feature-details.js"></script>
<script>
(function () {
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function param(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
  }

  var all = window.FEATURES || [];
  var id = param("id");
  var feature = all.filter(function (f) { return f.id === id; })[0];
  var host = document.getElementById("content");

  if (!feature) {
    host.innerHTML = '<div class="missing"><h1>No such feature</h1>' +
      "<p>Nothing here is called <code>" + esc(id || "(nothing)") + "</code>.</p>" +
      '<p><a class="btn btn-secondary" href="features.html">Back to all features</a></p></div>';
    return;
  }

  document.title = feature.title + " — Mullion";
  var d = (window.FEATURE_DETAILS || {})[feature.id] || null;
  var repo = "https://github.com/aylith-labs/mullion/commit/";
  var html = "";

  // Every optional block is a <section data-section="<id>">, so the display
  // settings can show or hide it without re-rendering (site.js + site.css).
  function section(key, title, body) {
    return '<section data-section="' + key + '" aria-labelledby="h-' + key + '"><h2 id="h-' + key + '">' + title + "</h2>" + body + "</section>";
  }

  html += '<nav class="crumbs" aria-label="Breadcrumb">' +
    '<a href="features.html">Features</a><span class="sep" aria-hidden="true">/</span>' +
    '<a href="features.html?cat=' + encodeURIComponent(feature.cat) + '">' + esc(feature.catLabel) + "</a>" +
    "</nav>";
  html += '<div class="meta">' +
    '<span class="tag tag-accent">' + esc(feature.catLabel) + "</span>" +
    (feature.standout ? '<span class="tag tag-success">Standout</span>' : "") +
    '<span class="tag">Added&nbsp;' + Mullion.timeTag(feature.dateAdded) + "</span>" +
    "</div>";
  html += "<h1>" + esc(feature.title) + "</h1>";
  html += '<p class="lede">' + feature.desc + "</p>";

  html += '<div class="stats" data-section="stats" role="group" aria-label="Change size">' +
    '<div class="stat"><div class="n stat-add">+' + feature.ins.toLocaleString() + '</div><div class="l">lines added</div></div>' +
    '<div class="stat"><div class="n">&minus;' + feature.del.toLocaleString() + '</div><div class="l">lines removed</div></div>' +
    '<div class="stat"><div class="n">' + feature.files + '</div><div class="l">files</div></div>' +
    '<div class="stat"><div class="n">' + feature.commits.length + '</div><div class="l">commit' + (feature.commits.length === 1 ? "" : "s") + "</div></div>" +
    "</div>";

  if (d && d.media && d.media.length) {
    var figs = "";
    for (var m = 0; m < d.media.length; m++) {
      var item = d.media[m];
      var alt = esc(item.caption);
      var body;
      if (item.kind === "video") {
        var lightPoster = item.base === "resume-restore" ? ' poster="media/resume-toast-light.png"' : "";
        var darkPoster = item.base === "resume-restore" ? ' poster="media/resume-toast-dark.png"' : "";
        // Muted + playsinline + loop so it behaves like an animation rather
        // than something that demands to be started; controls stay available
        // for anyone who wants to scrub it.
        body =
          '<video class="shot-light" src="media/' + item.base + '-light.mp4" aria-label="' + alt + '" ' +
          'autoplay loop muted playsinline controls preload="metadata"' + lightPoster + '></video>' +
          '<video class="shot-dark" src="media/' + item.base + '-dark.mp4" aria-label="' + alt + '" ' +
          'autoplay loop muted playsinline controls preload="metadata"' + darkPoster + '></video>';
      } else {
        body =
          '<img class="shot-light" src="media/' + item.base + '-light.png" alt="' + alt + '" loading="lazy" />' +
          '<img class="shot-dark" src="media/' + item.base + '-dark.png" alt="' + alt + '" loading="lazy" />';
      }
      var ext = item.kind === "video" ? ".mp4" : ".png";
      var label = item.kind === "video" ? "recording" : "image";
      figs += '<figure data-base="' + esc(item.base) + '">' + body +
        '<div class="pending"><button type="button" data-retry-media>Retry ' + label + '</button> · Open the ' + label + ': ' +
        '<a download href="media/' + esc(item.base) + '-light' + ext + '">Light version</a> · ' +
        '<a download href="media/' + esc(item.base) + '-dark' + ext + '">Dark version</a></div>' +
        '<figcaption aria-hidden="true">' + alt + "</figcaption></figure>";
    }
    html += section("media", "What it looks like", figs);
  }

  if (d && d.problem) { html += section("problem", "Why it exists", "<p>" + d.problem + "</p>"); }
  if (d && d.how) { html += section("how", "How it works", "<p>" + d.how + "</p>"); }

  if (d && d.steps && d.steps.length) {
    var steps = '<ol class="steps">';
    for (var s = 0; s < d.steps.length; s++) { steps += "<li>" + d.steps[s] + "</li>"; }
    html += section("steps", "Try it", steps + "</ol>");
  }

  if (d && d.settings && d.settings.length) {
    var table = '<div class="table-scroll"><table><thead><tr>' +
      '<th scope="col">Key</th><th scope="col">Default</th><th scope="col">What it does</th></tr></thead><tbody>';
    for (var t = 0; t < d.settings.length; t++) {
      var r = d.settings[t];
      table += "<tr><td><code>" + esc(r.key) + "</code></td><td><code>" + esc(r.def) + "</code></td><td>" + r.note + "</td></tr>";
    }
    html += section("settings", "Settings", table + "</tbody></table></div>");
  }

  if (d && d.notes && d.notes.length) {
    var notes = '<ul class="notes">';
    for (var n = 0; n < d.notes.length; n++) { notes += "<li>" + d.notes[n] + "</li>"; }
    html += section("notes", "Worth knowing", notes + "</ul>");
  }

  if (d && d.upstream) { html += section("upstream", "What upstream did", "<p>" + d.upstream + "</p>"); }

  if (!d) {
    html += '<section aria-labelledby="h-doc"><h2 id="h-doc">Documentation</h2><div class="callout"><p>' +
      "The long-form write-up for this one is still to be written. The summary above is accurate in the meantime." +
      "</p></div></section>";
  }

  var commits = '<div class="commits">';
  for (var c = 0; c < feature.commits.length; c++) {
    commits += '<a class="commit-link" href="' + repo + feature.commits[c] + '" target="_blank" rel="noopener">' + esc(feature.commits[c]) + "</a>";
  }
  html += section("commits", "Commits", commits + "</div>");

  // Previous / next in the catalogue's default order (newest first), so the
  // pages can be read straight through.
  var ordered = all.slice().sort(function (a, b) { return b.dateAdded.localeCompare(a.dateAdded) || a.title.localeCompare(b.title); });
  var at = ordered.indexOf(feature);
  var prev = ordered[at - 1], next = ordered[at + 1];
  if (prev || next) {
    html += '<nav class="pager" aria-label="More features">' +
      (prev ? '<a class="prev" href="feature.html?id=' + encodeURIComponent(prev.id) + '"><span class="dir">&larr; Newer</span><span class="t">' + esc(prev.title) + "</span></a>" : "") +
      (next ? '<a class="next" href="feature.html?id=' + encodeURIComponent(next.id) + '"><span class="dir">Older &rarr;</span><span class="t">' + esc(next.title) + "</span></a>" : "") +
      "</nav>";
  }

  host.innerHTML = html;
  Mullion.formatDates(host);

  // A figure offers the original files if neither theme loads. Wiring this up
  // after insertion, rather than as an inline onerror attribute, keeps the
  // quoting out of an HTML attribute nested inside a JS string -- which is
  // three levels of escaping and exactly the kind of thing that breaks
  // silently and only in the case that matters.
  var figures = host.querySelectorAll("figure[data-base]");
  for (var i = 0; i < figures.length; i++) {
    (function (fig) {
      var shots = fig.querySelectorAll("img, video");
      function refresh() {
        var missing = 0;
        for (var n = 0; n < shots.length; n++) {
          if (shots[n].classList.contains("absent")) { missing++; }
        }
        fig.classList.toggle("no-media", missing === shots.length);
      }
      fig.querySelector("[data-retry-media]").addEventListener("click", function () {
        for (var n = 0; n < shots.length; n++) {
          shots[n].classList.remove("absent");
          if (shots[n].tagName === "VIDEO") { shots[n].load(); }
          else { shots[n].src = shots[n].getAttribute("src"); }
        }
        refresh();
      });
      for (var j = 0; j < shots.length; j++) {
        shots[j].addEventListener("error", function () {
          // A video reports failure on its own element, not by bubbling, so
          // both node types are listened to the same way.
          this.classList.add("absent");
          refresh();
        });
        var recovered = function () {
          this.classList.remove("absent");
          refresh();
        };
        shots[j].addEventListener(shots[j].tagName === "VIDEO" ? "loadeddata" : "load", recovered);
      }
    })(figures[i]);
  }
})();
</script>
</body>
</html>
