<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Features — Mullion</title>
<meta name="description" content="Every feature this Windows Terminal fork has that upstream doesn't, with dates, size, and links to the commits." />
<meta name="color-scheme" content="light dark" />

<script src="site.js"></script>
</head>
<body>

<a class="skip-link" href="#results">Skip to results</a>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html" aria-label="Mullion home">
      <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true"><rect class="frame" x="2" y="3" width="22" height="20" rx="4" stroke-width="1.6"/><rect class="bar" x="12" y="3" width="2" height="20"/><rect class="bar" x="2" y="8" width="22" height="1.6"/></svg>
      Mullion
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="features.html" aria-current="page">Features</a>
      <a href="https://github.com/aylith-labs/mullion">GitHub<svg class="ext" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
    </nav>
    <button type="button" class="icon-btn" data-settings-trigger aria-label="Display settings" title="Display settings" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="container page-head">
    <h1>Features</h1>
    <p>Everything this fork has that upstream doesn't. Open one for what it does, why it exists, and how to try it.</p>
  </div>

  <div class="toolbar-wrap">
    <div class="container toolbar" role="search">
      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <label class="visually-hidden" for="search">Search features</label>
        <input type="search" id="search" placeholder="Search features" autocomplete="off" />
        <kbd aria-hidden="true">/</kbd>
      </div>
      <div class="chip-row" id="category-chips" role="group" aria-label="Category">
        <button type="button" class="chip" data-cat="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-cat="automation" aria-pressed="false">Automation</button>
        <button type="button" class="chip" data-cat="links" aria-pressed="false">Links</button>
        <button type="button" class="chip" data-cat="ui" aria-pressed="false">UI &amp; theming</button>
        <button type="button" class="chip" data-cat="deploy" aria-pressed="false">Deploy system</button>
      </div>
      <div class="toolbar-end">
        <label class="visually-hidden" for="sort-select">Sort by</label>
        <select class="select" id="sort-select">
          <option value="date-desc">Newest first</option>
          <option value="date-asc">Oldest first</option>
          <option value="size-desc">Largest change</option>
          <option value="size-asc">Smallest change</option>
          <option value="alpha">A&ndash;Z</option>
          <option value="cat">Category</option>
        </select>
        <div class="view-switch" role="group" aria-label="Layout">
          <button type="button" data-view="cards" aria-pressed="true">Cards</button>
          <button type="button" data-view="preview" aria-pressed="false">Preview</button>
          <button type="button" data-view="table" aria-pressed="false">Table</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container" id="results" tabindex="-1">
    <p class="result-count" id="result-count" aria-live="polite"></p>
    <div class="feature-grid" id="view-cards"></div>
    <div class="feature-grid preview" id="view-preview" hidden></div>
    <div class="table-scroll" id="view-table" hidden>
      <table class="feature-table">
        <thead>
          <tr>
            <th scope="col" data-sort-col="alpha"><button type="button">Feature</button></th>
            <th scope="col" data-sort-col="cat"><button type="button">Category</button></th>
            <th scope="col" data-sort-col="date-desc"><button type="button">Added</button></th>
            <th scope="col" data-sort-col="size-desc" data-section="stats"><button type="button">Changed</button></th>
            <th scope="col" data-section="commits"><span class="plain">Commits</span></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>
      <p>No feature matches that search.</p>
      <button type="button" class="btn btn-quiet btn-sm" id="clear-filters">Clear search and filters</button>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <span>Mullion, a fork of <a href="https://github.com/microsoft/terminal">microsoft/terminal</a>. MIT licensed.</span>

      <a href="index.html">Home</a>

    </nav>
  </div>
</footer>

<script src="features.js"></script>
<script src="feature-details.js"></script>
<script>
(function () {
  var REPO = "https://github.com/aylith-labs/mullion/commit/";
  var FEATURES = window.FEATURES || [];
  var DETAILS = window.FEATURE_DETAILS || {};
  var VIEWS = ["cards", "preview", "table"];
  var CATS = ["all", "automation", "links", "ui", "deploy"];
  var SORTS = ["date-desc", "date-asc", "size-desc", "size-asc", "alpha", "cat"];

  // Filters live in the URL, so a filtered list can be linked to (the home
  // page links straight to ?cat=links) and survives back/forward.
  function param(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
  }
  var state = {
    query: param("q"),
    cat: CATS.indexOf(param("cat")) !== -1 ? param("cat") : "all",
    sort: SORTS.indexOf(param("sort")) !== -1 ? param("sort") : "date-desc",
    view: VIEWS.indexOf(param("view")) !== -1 ? param("view") : "cards"
  };
  // The layout is a per-visitor preference rather than part of a link.
  if (!param("view")) {
    try { var v = localStorage.getItem("mullion-features-view"); if (VIEWS.indexOf(v) !== -1) { state.view = v; } } catch (e) {}
  }

  function writeUrl() {
    var q = [];
    if (state.query) { q.push("q=" + encodeURIComponent(state.query)); }
    if (state.cat !== "all") { q.push("cat=" + state.cat); }
    if (state.sort !== "date-desc") { q.push("sort=" + state.sort); }
    var url = window.location.pathname + (q.length ? "?" + q.join("&") : "");
    try { history.replaceState(null, "", url); } catch (e) {}
  }

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function plain(html) { var d = document.createElement("div"); d.innerHTML = html; return d.textContent || ""; }

  function matches(f) {
    if (state.cat !== "all" && f.cat !== state.cat) { return false; }
    if (!state.query) { return true; }
    var q = state.query.toLowerCase();
    return (f.title + " " + plain(f.desc) + " " + f.catLabel).toLowerCase().indexOf(q) !== -1;
  }

  function compare(a, b) {
    switch (state.sort) {
      case "date-asc": return a.dateAdded.localeCompare(b.dateAdded) || a.title.localeCompare(b.title);
      case "date-desc": return b.dateAdded.localeCompare(a.dateAdded) || a.title.localeCompare(b.title);
      case "size-desc": return (b.ins + b.del) - (a.ins + a.del);
      case "size-asc": return (a.ins + a.del) - (b.ins + b.del);
      case "alpha": return a.title.localeCompare(b.title);
      case "cat": return a.catLabel.localeCompare(b.catLabel) || a.title.localeCompare(b.title);
      default: return 0;
    }
  }

  function docHref(f) { return "feature.html?id=" + encodeURIComponent(f.id); }

  function commitLinks(f) {
    return f.commits.map(function (sha) {
      return '<a class="commit-link" href="' + REPO + sha + '" target="_blank" rel="noopener" aria-label="Commit ' + sha.slice(0, 7) + ' on GitHub">' + sha.slice(0, 7) + "</a>";
    }).join("");
  }

  function stats(f) {
    return '<span data-section="stats"><span class="stat-add">+' + f.ins.toLocaleString() + '</span> <span class="stat-del">&minus;' +
      f.del.toLocaleString() + "</span> &middot; " + f.files + " files</span>";
  }

  function metaRow(f) {
    return '<div class="meta-row"><span>Added ' + Mullion.timeTag(f.dateAdded) + "</span>" + stats(f) + "</div>";
  }

  function badge(f) { return f.standout ? '<span class="tag tag-success">Standout</span>' : ""; }

  function firstImage(f) {
    var d = DETAILS[f.id];
    if (!d || !d.media) { return null; }
    for (var i = 0; i < d.media.length; i++) {
      if (d.media[i].kind !== "video" && !/badge/.test(d.media[i].base)) { return d.media[i]; }
    }
    return null;
  }

  function card(f, preview) {
    var thumb = "";
    if (preview) {
      var img = firstImage(f);
      thumb = img
        ? '<div class="thumb"><picture><source srcset="media/' + img.base + '-dark.png" media="(prefers-color-scheme: dark)" data-theme-source="dark" />' +
          '<img src="media/' + img.base + '-light.png" alt="" loading="lazy" /></picture></div>'
        : '<div class="thumb" aria-hidden="true">No screenshot yet</div>';
    }
    return '<article class="fcard">' + thumb +
      '<div class="card-top"><span class="kicker">' + esc(f.catLabel) + "</span>" + badge(f) + "</div>" +
      '<h3><a href="' + docHref(f) + '">' + esc(f.title) + "</a></h3>" +
      '<p class="desc">' + f.desc + "</p>" +
      metaRow(f) +
      '<div class="commit-row" data-section="commits">' + commitLinks(f) + "</div>" +
      "</article>";
  }

  function row(f) {
    return "<tr>" +
      '<td class="title-cell"><a href="' + docHref(f) + '">' + esc(f.title) + "</a>" + (f.standout ? " " + badge(f) : "") + "</td>" +
      '<td class="nowrap">' + esc(f.catLabel) + "</td>" +
      '<td class="nowrap">' + Mullion.timeTag(f.dateAdded) + "</td>" +
      '<td class="nowrap" data-section="stats"><span class="stat-add">+' + f.ins.toLocaleString() + '</span> <span class="stat-del">&minus;' + f.del.toLocaleString() + "</span></td>" +
      '<td data-section="commits"><div class="commit-row">' + commitLinks(f) + "</div></td>" +
      "</tr>";
  }

  var els = {
    cards: document.getElementById("view-cards"),
    preview: document.getElementById("view-preview"),
    table: document.getElementById("view-table")
  };

  function render() {
    var list = FEATURES.filter(matches).sort(compare);
    document.getElementById("result-count").textContent =
      list.length === FEATURES.length ? FEATURES.length + " features" : list.length + " of " + FEATURES.length + " features";
    document.getElementById("empty").hidden = list.length !== 0;

    // Only the visible layout is rendered; switching layouts re-renders.
    for (var i = 0; i < VIEWS.length; i++) { els[VIEWS[i]].hidden = !list.length || VIEWS[i] !== state.view; }
    if (state.view === "table") {
      document.getElementById("table-body").innerHTML = list.map(row).join("");
    } else {
      els[state.view].innerHTML = list.map(function (f) { return card(f, state.view === "preview"); }).join("");
    }
    Mullion.formatDates(document.getElementById("results"));
    Mullion.syncPictures(document.getElementById("results"));
    syncControls();
    writeUrl();
  }

  function syncControls() {
    var chips = document.querySelectorAll("#category-chips .chip");
    for (var i = 0; i < chips.length; i++) {
      var cat = chips[i].getAttribute("data-cat");
      chips[i].setAttribute("aria-pressed", String(cat === state.cat));
      var n = cat === "all" ? FEATURES.length : FEATURES.filter(function (f) { return f.cat === cat; }).length;
      var label = chips[i].getAttribute("data-label") || chips[i].textContent;
      chips[i].setAttribute("data-label", label);
      chips[i].innerHTML = esc(label) + ' <span class="count">' + n + "</span>";
    }
    var buttons = document.querySelectorAll(".view-switch button");
    for (var j = 0; j < buttons.length; j++) {
      buttons[j].setAttribute("aria-pressed", String(buttons[j].getAttribute("data-view") === state.view));
    }
    document.getElementById("sort-select").value = state.sort;
    var ths = document.querySelectorAll("th[data-sort-col]");
    for (var k = 0; k < ths.length; k++) {
      var col = ths[k].getAttribute("data-sort-col");
      var on = col === state.sort || (col === "date-desc" && state.sort === "date-asc") || (col === "size-desc" && state.sort === "size-asc");
      if (on) { ths[k].setAttribute("aria-sort", /asc$|alpha|cat/.test(state.sort) ? "ascending" : "descending"); }
      else { ths[k].removeAttribute("aria-sort"); }
    }
  }

  var search = document.getElementById("search");
  search.value = state.query;
  search.addEventListener("input", function () { state.query = search.value.trim(); render(); });

  document.getElementById("category-chips").addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (!chip) { return; }
    state.cat = chip.getAttribute("data-cat");
    render();
  });

  document.getElementById("sort-select").addEventListener("change", function (e) { state.sort = e.target.value; render(); });

  document.querySelector(".view-switch").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-view]");
    if (!b) { return; }
    state.view = b.getAttribute("data-view");
    try { localStorage.setItem("mullion-features-view", state.view); } catch (err) {}
    render();
  });

  // Column headers sort too; a second click on the same column reverses it.
  document.querySelector(".feature-table thead").addEventListener("click", function (e) {
    var th = e.target.closest("th[data-sort-col]");
    if (!th) { return; }
    var col = th.getAttribute("data-sort-col");
    if (col === "date-desc") { state.sort = state.sort === "date-desc" ? "date-asc" : "date-desc"; }
    else if (col === "size-desc") { state.sort = state.sort === "size-desc" ? "size-asc" : "size-desc"; }
    else { state.sort = col; }
    render();
  });

  document.getElementById("clear-filters").addEventListener("click", function () {
    state.query = ""; state.cat = "all"; search.value = ""; render(); search.focus();
  });

  // "/" jumps to search, as on GitHub; Esc in the box clears it.
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey) {
      var t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) { return; }
      e.preventDefault();
      search.focus();
      search.select();
    }
  });
  search.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && search.value) { e.stopPropagation(); search.value = ""; state.query = ""; render(); }
  });

  render();
})();
</script>

</body>
</html>
